<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 일괄 경량화 도구 (WebP 기본)</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>

  <style>
    :root {
      /* 기본 테마 색상 (인디고) */
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-soft: #eef2ff;
      
      /* 컨트롤 전용 색상 분리 (딥스카이 계열) */
      --slider-track-fill: #0284c7;        /* 밝은 딥스카이 (트랙 & PNG 활성 버튼) */
      --slider-thumb-border: #075985;      /* 짙은 오션스카이 (버튼 테두리 & 말풍선) */
      --slider-thumb-border-hover: #082f49;
      --control-soft-bg: #f0f9ff;          /* 연한 딥스카이 (PNG 호버 배경) */
      
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-size: 16px;
      min-height: 100vh;
      margin: 0;
      padding: 44px 20px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* 헤더 스타일링 */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header h2 {
      font-size: 46px;
      font-weight: 800;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #312e81, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      font-size: 17px;
      color: var(--text-muted);
      margin: 0;
      font-weight: 500;
    }

    /* 안내 박스 */
    .info-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      padding: 22px 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .info-box-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .info-box-list li {
      font-size: 15px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 14px;
      line-height: 1.55;
    }
    .format-badges {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      width: 118px;
    }
    .badge {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge.webp { background: #e0e7ff; color: #4338ca; }
    .badge.jpeg { background: #fef08a; color: #854d0e; }
    .badge.png { background: #dcfce3; color: #166534; }

    /* 업로드 영역 */
    .upload-area {
      background-color: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border: 2px dashed #818cf8;
      border-radius: 20px;
      padding: 48px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 24px;
    }
    .upload-area:hover, .upload-area.dragover {
      background-color: var(--card-bg);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.15);
    }
    .upload-icon {
      font-size: 34px;
      margin-bottom: 12px;
    }
    .upload-area p {
      margin: 0 0 8px 0;
      color: var(--primary-hover);
      font-weight: 700;
      font-size: 19px;
    }
    .upload-area span {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 500;
    }
    #fileInput { display: none; }

    /* 이미지 리스트 */
    .image-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    .image-item {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 20px;
      border: 1px solid var(--border);
      transition: all 0.25s ease;
    }
    .image-item:hover {
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
    }
    .image-item.downloaded {
      background-color: #f0fdf4;
      border-color: #86efac;
    }
    .preview {
      width: 92px;
      height: 92px;
      object-fit: contain;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 12px;
      background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
    }
    .details { flex: 1; }
    .details h4 {
      margin: 0 0 8px 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-all;
    }
    .image-item.downloaded h4 { color: #166534; }
    .stats {
      font-size: 14.5px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .stats span strong { color: var(--text-main); font-weight: 700; }
    .savings { color: var(--success); font-weight: 700; }
    .savings.negative { color: var(--danger); }

    .actions { display: flex; gap: 10px; }
    button {
      padding: 11px 18px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .btn-download { background: var(--primary); color: white; }
    .btn-download:hover { background: var(--primary-hover); }
    .btn-download:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-download.downloaded-btn { background: #94a3b8; color: #ffffff; }
    .btn-delete { background: #fee2e2; color: var(--danger); }
    .btn-delete:hover { background: #fecaca; color: #dc2626; }

    /* 하단 컨트롤 패널 */
    .bottom-panel {
      background: var(--card-bg);
      padding: 26px 28px;
      border-radius: 20px;
      box-shadow: 0 8px 20px -5px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .controls {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-group label {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .control-group label span {
      color: var(--primary);
      font-weight: 700;
      font-size: 16px;
    }
    
    /* 셀렉트 박스 */
    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px 42px 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
    }
    select:hover { border-color: #94a3b8; }
    select:focus {
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* --- 슬라이더 & 말풍선 --- */
    .slider-wrapper {
      position: relative;
      width: 100%;
      padding: 38px 0 10px 0;
      margin-top: -6px;
      display: flex;
      align-items: center;
    }

    .slider-tooltip {
      position: absolute;
      top: -4px;
      transform: translateX(-50%);
      background: var(--slider-thumb-border);
      color: #ffffff;
      padding: 4px 11px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      pointer-events: none;
      box-shadow: 0 3px 8px -2px rgba(7, 89, 133, 0.35);
      white-space: nowrap;
      z-index: 10;
      will-change: left;
    }

    .slider-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px;
      border-style: solid;
      border-color: var(--slider-thumb-border) transparent transparent transparent;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      background: #e2e8f0;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3.5px solid var(--slider-thumb-border);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(7, 89, 133, 0.25);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    
    input[type=range]::-webkit-slider-thumb:hover,
    input[type=range]::-webkit-slider-thumb:active {
      border-color: var(--slider-thumb-border-hover);
      box-shadow: 0 0 0 5px rgba(7, 89, 133, 0.15), 0 3px 8px rgba(7, 89, 133, 0.3);
    }

    input[type=range]::-moz-range-thumb {
      box-sizing: border-box;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3.5px solid var(--slider-thumb-border);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(7, 89, 133, 0.25);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type=range]::-moz-range-thumb:hover,
    input[type=range]::-moz-range-thumb:active {
      border-color: var(--slider-thumb-border-hover);
      box-shadow: 0 0 0 5px rgba(7, 89, 133, 0.15), 0 3px 8px rgba(7, 89, 133, 0.3);
    }

    /* --- PNG 전용 컨트롤 색상 (슬라이더 딥스카이 색상 통일) --- */
    
    /* 라벨 강조 텍스트 색상 통일 */
    #pngControl label span {
      color: var(--slider-track-fill);
    }

    .png-color-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .color-chip {
      background: #f8fafc;
      color: var(--text-muted);
      border: 1px solid #cbd5e1;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    
    .color-chip:hover {
      border-color: var(--slider-track-fill);
      color: var(--slider-track-fill);
      background: var(--control-soft-bg); /* 연한 딥스카이 배경 */
    }
    
    .color-chip.active {
      background: var(--slider-track-fill);
      color: #ffffff;
      border-color: var(--slider-track-fill);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25); /* 딥스카이 그림자 */
    }

    /* 하단 전체 다운로드 버튼 */
    .btn-download-all {
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 12px;
      display: none;
      width: 100%;
      margin-top: 24px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }
    .btn-download-all:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
    }

    @media (max-width: 600px) {
      .info-box-list li {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .image-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .actions { width: 100%; }
      .actions button { flex: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <h2>이미지 일괄 경량화 도구</h2>
      <p>서버 전송 없이 브라우저에서 안전하고 빠르게 여러 이미지를 압축합니다.</p>
    </div>

    <!-- 포맷 비교 안내 박스 -->
    <div class="info-box" id="infoBox">
      <ul class="info-box-list">
        <li>
          <div class="format-badges">
            <span class="badge webp">WebP</span>
            <span class="badge jpeg">JPEG</span>
          </div>
          <span><strong>압축 품질(Quality)</strong>을 조절하여 이미지 용량을 획기적으로 줄입니다. (WebP 권장)</span>
        </li>
        <li>
          <div class="format-badges">
            <span class="badge png">PNG</span>
          </div>
          <span><strong>최대 색상 수</strong>를 줄이는 최적화 알고리즘으로 투명도를 유지하면서 용량을 줄입니다.</span>
        </li>
      </ul>
    </div>

    <!-- 업로드 영역 -->
    <div class="upload-area" id="dropZone">
      <div class="upload-icon">📁</div>
      <p>여기를 클릭하거나 여러 개의 이미지를 드래그 앤 드롭 하세요</p>
      <span>지원 포맷: JPG, PNG, WebP 등</span>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>

    <!-- 이미지 리스트 -->
    <div class="image-list" id="imageList"></div>

    <!-- 하단 컨트롤 패널 -->
    <div class="bottom-panel" id="bottomPanel">
      <div class="controls">
        <div class="control-group">
          <label for="formatSelect">출력 포맷</label>
          <select id="formatSelect">
            <option value="image/webp" selected>WebP (권장, 투명도 지원)</option>
            <option value="image/jpeg">JPEG (투명배경 흰색처리)</option>
            <option value="image/png">PNG (투명도 지원)</option>
          </select>
        </div>
        
        <!-- WebP / JPEG 용 품질 슬라이더 -->
        <div class="control-group" id="qualityControl" style="flex: 1;">
          <label>압축 품질 (Quality)</label>
          <div class="slider-wrapper">
            <input type="range" id="qualitySlider" min="10" max="100" value="80">
            <div class="slider-tooltip" id="sliderTooltip">80%</div>
          </div>
        </div>

        <!-- PNG 전용 색상 수 선택 UI -->
        <div class="control-group" id="pngControl" style="flex: 1; display: none;">
          <label>최대 색상 수 (팔레트 최적화): <span id="pngColorLabel">256색 (균형)</span></label>
          <div class="png-color-options" id="pngColorOptions">
            <button type="button" class="color-chip active" data-colors="256" data-label="256색 (균형)">256색</button>
            <button type="button" class="color-chip" data-colors="128" data-label="128색 (고압축)">128색</button>
            <button type="button" class="color-chip" data-colors="64" data-label="64색 (초고압축)">64색</button>
            <button type="button" class="color-chip" data-colors="32" data-label="32색 (최소 용량)">32색</button>
            <button type="button" class="color-chip" data-colors="0" data-label="무손실 (원본 색상)">무손실</button>
          </div>
        </div>
      </div>

      <button class="btn-download-all" id="btnDownloadAll">전체 이미지 다운로드</button>
    </div>

  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const imageList = document.getElementById('imageList');
    const formatSelect = document.getElementById('formatSelect');
    const qualityControl = document.getElementById('qualityControl');
    const qualitySlider = document.getElementById('qualitySlider');
    const sliderTooltip = document.getElementById('sliderTooltip');
    const pngControl = document.getElementById('pngControl');
    const pngColorLabel = document.getElementById('pngColorLabel');
    const pngColorButtons = document.querySelectorAll('.color-chip');
    const btnDownloadAll = document.getElementById('btnDownloadAll');

    let imagesData = [];
    let selectedPngColors = 256;

    function updateSliderUI() {
      const val = qualitySlider.value;
      const min = qualitySlider.min || 10;
      const max = qualitySlider.max || 100;
      const percent = (val - min) / (max - min);
      const thumbWidth = 22;
      const offset = (0.5 - percent) * thumbWidth;
      
      sliderTooltip.textContent = val + '%';
      sliderTooltip.style.left = `calc(${percent * 100}% + ${offset}px)`;
      qualitySlider.style.background = `linear-gradient(to right, var(--slider-track-fill) ${percent * 100}%, #e2e8f0 ${percent * 100}%)`;
    }

    updateSliderUI();

    qualitySlider.addEventListener('input', updateSliderUI);
    qualitySlider.addEventListener('change', recompressAll);

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    formatSelect.addEventListener('change', () => {
      updateControlVisibility();
      recompressAll();
    });

    pngColorButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        pngColorButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedPngColors = parseInt(btn.dataset.colors, 10);
        pngColorLabel.textContent = btn.dataset.label;
        recompressAll();
      });
    });

    btnDownloadAll.addEventListener('click', () => {
      imagesData.forEach(data => downloadImage(data.blob, data.filename, data.id));
    });

    function updateControlVisibility() {
      const isPng = formatSelect.value === 'image/png';
      qualityControl.style.display = isPng ? 'none' : 'flex';
      pngControl.style.display = isPng ? 'flex' : 'none';
      if (!isPng) updateSliderUI();
    }

    async function handleFiles(files) {
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;

        const id = Date.now() + Math.random().toString(36).substr(2, 9);
        createImageItemUI(id, file.name);

        const data = { id, originalFile: file, filename: file.name, blob: null };
        imagesData.push(data);
        
        await processImage(data);
      }
      updateDownloadAllButton();
    }

    async function recompressAll() {
      for (const data of imagesData) {
        await processImage(data);
      }
    }

    async function processImage(data) {
      const format = formatSelect.value;
      const quality = parseInt(qualitySlider.value, 10) / 100;
      
      const compressedBlob = await compressImage(data.originalFile, format, quality, selectedPngColors);
      data.blob = compressedBlob;
      
      const ext = format.split('/')[1] === 'jpeg' ? 'jpg' : format.split('/')[1];
      data.filename = data.originalFile.name.replace(/\.[^/.]+$/, "") + "." + ext;

      updateImageItemUI(data.id, data.originalFile, compressedBlob, data.filename);
    }

    function compressImage(file, format, quality, pngColors) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');

            if (format === 'image/jpeg') {
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.drawImage(img, 0, 0);

            if (format === 'image/png') {
              const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer;
              try {
                const compressedBuffer = UPNG.encode([imgData], canvas.width, canvas.height, pngColors);
                const blob = new Blob([compressedBuffer], { type: 'image/png' });
                resolve(blob);
              } catch(err) {
                canvas.toBlob((blob) => resolve(blob), format);
              }
            } else {
              canvas.toBlob((blob) => resolve(blob), format, quality);
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function createImageItemUI(id, filename) {
      const div = document.createElement('div');
      div.className = 'image-item';
      div.id = `item-${id}`;
      div.innerHTML = `
        <img class="preview" id="preview-${id}" src="" alt="preview">
        <div class="details">
          <h4>${filename} <span style="font-size:13px; color:#94a3b8; font-weight:500;">(처리중...)</span></h4>
          <div class="stats" id="stats-${id}"></div>
        </div>
        <div class="actions">
          <button class="btn-download" id="dl-${id}" disabled>다운로드</button>
          <button class="btn-delete" onclick="removeImage('${id}')">삭제</button>
        </div>
      `;
      imageList.appendChild(div);
    }

    function updateImageItemUI(id, originalFile, compressedBlob, newFilename) {
      const item = document.getElementById(`item-${id}`);
      if (!item) return;

      const preview = document.getElementById(`preview-${id}`);
      const stats = document.getElementById(`stats-${id}`);
      const dlBtn = document.getElementById(`dl-${id}`);
      const title = item.querySelector('h4');

      item.classList.remove('downloaded');
      dlBtn.classList.remove('downloaded-btn');
      dlBtn.textContent = '다운로드';

      title.textContent = newFilename;
      preview.src = URL.createObjectURL(compressedBlob);

      const origSize = (originalFile.size / 1024).toFixed(1);
      const newSize = (compressedBlob.size / 1024).toFixed(1);
      const ratio = ((1 - (compressedBlob.size / originalFile.size)) * 100).toFixed(1);
      
      const isNegative = compressedBlob.size > originalFile.size;
      const savingsClass = isNegative ? 'negative' : 'savings';
      const savingsText = isNegative ? `용량 증가 (+${Math.abs(ratio)}%)` : `절감됨 (${ratio}%)`;

      stats.innerHTML = `
        <span>원본: ${origSize} KB</span>
        <span>압축후: <strong>${newSize} KB</strong></span>
        <span class="${savingsClass}">${savingsText}</span>
      `;

      dlBtn.disabled = false;
      dlBtn.onclick = () => downloadImage(compressedBlob, newFilename, id);
    }

    function removeImage(id) {
      imagesData = imagesData.filter(d => d.id !== id);
      const item = document.getElementById(`item-${id}`);
      if (item) item.remove();
      updateDownloadAllButton();
    }

    function updateDownloadAllButton() {
      btnDownloadAll.style.display = imagesData.length > 1 ? 'block' : 'none';
    }

    function downloadImage(blob, filename, id) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      if(id) {
        const item = document.getElementById(`item-${id}`);
        const dlBtn = document.getElementById(`dl-${id}`);
        if(item && dlBtn) {
          item.classList.add('downloaded');
          dlBtn.classList.add('downloaded-btn');
          dlBtn.textContent = '다운로드 완료';
        }
      }
    }
  </script>
</body>
</html>
